name: CI

on:
  pull_request:
    branches: ["2.0"]
  push:
    branches: ["2.0"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      revision: ${{ steps.lock.outputs.revision }}
      schema_version: ${{ steps.lock.outputs.schema_version }}
      sha256: ${{ steps.lock.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Read Catalog lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import json; p=json.load(open("unifi-catalog.lock.json", encoding="utf-8")); print("revision=" + p["revision"]); print("schema_version=" + str(p["schema_version"])); print("sha256=" + p["catalog_sha256"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: 404404/UniFi_Catalog
          ref: ${{ steps.lock.outputs.revision }}
          path: external/UniFi_Catalog
          fetch-depth: 1
          persist-credentials: false
      - name: Install Catalog validation dependency
        run: python3 -m pip install --disable-pip-version-check --no-input -r external/UniFi_Catalog/requirements-dev.txt
      - name: Validate and stage locked Catalog
        run: |
          python3 scripts/acquire_unifi_catalog.py \
            --source-dir external/UniFi_Catalog \
            --output-dir clients/unifi_catalog
      - uses: actions/upload-artifact@v4
        with:
          name: hardwarestatus-ci-catalog
          path: clients/unifi_catalog
          if-no-files-found: error

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/validate_migration_contracts.py

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go mod download
      - name: Check gofmt
        run: |
          files="$(gofmt -l .)"
          for file in $files; do
            gofmt -d "$file"
          done
          test -z "$files"
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...

  python:
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: hardwarestatus-ci-catalog
          path: clients/unifi_catalog
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 -m unittest discover -s clients -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: python3 -m py_compile clients/client-linux.py clients/client-psutil.py clients/host_collector.py scripts/export-hermes-status.py scripts/hermes_config_summary.py
      - run: sh -n clients/entrypoint.sh && bash -n status.sh

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: find web -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: node --test web/js/app.test.js
      - run: python3 scripts/check_release_boundaries.py

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: ADMIN_TOKEN=ci-placeholder docker compose -f docker-compose-server.yml config --quiet
      - run: SERVER=192.0.2.10 SERVERSTATUS_USER=ci-node PASSWORD=ci-placeholder CLIENT_PRIVILEGED=false HERMES_ROOT_HOST=/tmp/hermes CLIENT_STATUS_DIR_HOST=/tmp/client-status docker compose -f docker-compose-client.yml config --quiet

  images:
    needs: [catalog, contracts, go, python, frontend, compose, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: hardwarestatus-ci-catalog
          path: clients/unifi_catalog
      - uses: docker/setup-buildx-action@v3
      - name: Prepare image provenance
        id: provenance
        shell: bash
        run: |
          echo "candidate_tag=2.8-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "product_version=2.8" >> "$GITHUB_OUTPUT"
          echo "vcs_ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "source=https://github.com/404404/HardwareStatus" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: false
          load: true
          tags: hardwarestatus-server:${{ steps.provenance.outputs.candidate_tag }}
          build-args: |
            VERSION=${{ steps.provenance.outputs.product_version }}
            VCS_REF=${{ steps.provenance.outputs.vcs_ref }}
            BUILD_DATE=${{ steps.provenance.outputs.build_date }}
            SOURCE_URL=${{ steps.provenance.outputs.source }}
            CATALOG_REVISION=${{ needs.catalog.outputs.revision }}
            CATALOG_SCHEMA_VERSION=${{ needs.catalog.outputs.schema_version }}
            CATALOG_SHA256=${{ needs.catalog.outputs.sha256 }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - run: docker image inspect hardwarestatus-server:${{ steps.provenance.outputs.candidate_tag }} --format '{{json .Config.Entrypoint}}' | grep hardwarestatus-server
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.client
          push: false
          load: true
          tags: hardwarestatus-client:${{ steps.provenance.outputs.candidate_tag }}
          build-args: |
            VERSION=${{ steps.provenance.outputs.product_version }}
            VCS_REF=${{ steps.provenance.outputs.vcs_ref }}
            BUILD_DATE=${{ steps.provenance.outputs.build_date }}
            SOURCE_URL=${{ steps.provenance.outputs.source }}
            CATALOG_REVISION=${{ needs.catalog.outputs.revision }}
            CATALOG_SCHEMA_VERSION=${{ needs.catalog.outputs.schema_version }}
            CATALOG_SHA256=${{ needs.catalog.outputs.sha256 }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
      - run: docker image inspect hardwarestatus-client:${{ steps.provenance.outputs.candidate_tag }} --format '{{json .Config.Entrypoint}}' | grep entrypoint.sh
      - name: Validate image provenance
        run: |
          python3 scripts/validate_image_provenance.py \
            --server-image hardwarestatus-server:${{ steps.provenance.outputs.candidate_tag }} \
            --client-image hardwarestatus-client:${{ steps.provenance.outputs.candidate_tag }} \
            --candidate-tag "${{ steps.provenance.outputs.candidate_tag }}" \
            --version "${{ steps.provenance.outputs.product_version }}" \
            --revision "${{ steps.provenance.outputs.vcs_ref }}" \
            --created "${{ steps.provenance.outputs.build_date }}" \
            --source "${{ steps.provenance.outputs.source }}" \
            --catalog-revision "${{ needs.catalog.outputs.revision }}" \
            --catalog-schema-version "${{ needs.catalog.outputs.schema_version }}" \
            --catalog-sha256 "${{ needs.catalog.outputs.sha256 }}" \
            --require-server-catalog-provenance

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: python3 scripts/check_release_boundaries.py
      - run: python3 scripts/check_unifi_static_authority.py
