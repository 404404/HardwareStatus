name: Publish HardwareStatus Candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact full source commit SHA to build
        required: true
        type: string
      version:
        description: Candidate product version (for example 2.8)
        required: true
        default: "2.8"
        type: string

concurrency:
  group: hardwarestatus-candidate-${{ inputs.source_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      revision: ${{ steps.lock.outputs.revision }}
      schema_version: ${{ steps.lock.outputs.schema_version }}
      sha256: ${{ steps.lock.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Read Catalog lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import json; p=json.load(open("unifi-catalog.lock.json", encoding="utf-8")); print("revision=" + p["revision"]); print("schema_version=" + str(p["schema_version"])); print("sha256=" + p["catalog_sha256"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: 404404/UniFi_Catalog
          ref: ${{ steps.lock.outputs.revision }}
          path: external/UniFi_Catalog
          fetch-depth: 1
          persist-credentials: false
      - name: Install Catalog validation dependency
        run: python3 -m pip install --disable-pip-version-check --no-input -r external/UniFi_Catalog/requirements-dev.txt
      - name: Validate and stage locked Catalog
        run: |
          python3 scripts/acquire_unifi_catalog.py \
            --source-dir external/UniFi_Catalog \
            --output-dir clients/unifi_catalog
      - uses: actions/upload-artifact@v4
        with:
          name: hardwarestatus-candidate-catalog-${{ inputs.source_sha }}
          path: clients/unifi_catalog
          if-no-files-found: error

  validate:
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: hardwarestatus-candidate-catalog-${{ inputs.source_sha }}
          path: clients/unifi_catalog
      - name: Verify immutable source input
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
          PRODUCT_VERSION: ${{ inputs.version }}
        run: |
          test "$EXPECTED_SHA" = "$(git rev-parse HEAD)"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PRODUCT_VERSION" =~ ^2\.[0-9]+$ ]]
          version_minor="${PRODUCT_VERSION#2.}"
          (( version_minor >= 8 ))
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: python3 scripts/validate_migration_contracts.py
      - run: python3 -m unittest discover -s clients -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: python3 -m py_compile clients/client-linux.py clients/client-psutil.py clients/host_collector.py scripts/export-hermes-status.py scripts/hermes_config_summary.py
      - run: sh -n clients/entrypoint.sh && bash -n status.sh
      - run: go test ./...
        working-directory: server
      - run: go test -race ./...
        working-directory: server
      - run: go vet ./...
        working-directory: server
      - run: go build ./...
        working-directory: server
      - run: find web -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: node --test web/js/app.test.js
      - run: python3 scripts/check_release_boundaries.py
      - run: python3 scripts/check_unifi_static_authority.py
      - run: docker compose -f docker-compose-server.yml config --quiet
      - run: SERVER=192.0.2.10 SERVERSTATUS_USER=ci-node PASSWORD=ci-placeholder docker compose -f docker-compose-client.yml config --quiet

  publish:
    needs: [validate, catalog]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: hardwarestatus-candidate-catalog-${{ inputs.source_sha }}
          path: clients/unifi_catalog
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare exact immutable candidate
        id: candidate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PRODUCT_VERSION: ${{ inputs.version }}
        run: |
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          candidate_tag="${PRODUCT_VERSION}-${SOURCE_SHA:0:12}"
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          for image in \
            "ghcr.io/${owner}/hardwarestatus-server:${candidate_tag}" \
            "ghcr.io/${owner}/hardwarestatus-client:${candidate_tag}"; do
            if output="$(docker buildx imagetools inspect "$image" 2>&1)"; then
              echo "candidate tag already exists; refusing overwrite"
              exit 1
            elif ! grep -Eqi 'manifest unknown|not found|404' <<<"$output"; then
              echo "unable to prove candidate tag is absent; refusing publication"
              exit 1
            fi
          done
          echo "candidate_tag=${candidate_tag}" >> "$GITHUB_OUTPUT"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "catalog_revision=${{ needs.catalog.outputs.revision }}" >> "$GITHUB_OUTPUT"
          echo "catalog_schema_version=${{ needs.catalog.outputs.schema_version }}" >> "$GITHUB_OUTPUT"
          echo "catalog_sha256=${{ needs.catalog.outputs.sha256 }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: server_image
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hardwarestatus-server:${{ steps.candidate.outputs.candidate_tag }}
          labels: |
            org.opencontainers.image.title=HardwareStatus Server
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.created=${{ steps.candidate.outputs.created }}
            org.opencontainers.image.source=https://github.com/404404/HardwareStatus
            org.opencontainers.image.licenses=MIT
            io.hardwarestatus.component=server
            io.hardwarestatus.unifi.catalog.revision=${{ needs.catalog.outputs.revision }}
            io.hardwarestatus.unifi.catalog.schema_version=${{ needs.catalog.outputs.schema_version }}
            io.hardwarestatus.unifi.catalog.sha256=${{ needs.catalog.outputs.sha256 }}
          build-args: |
            VERSION=${{ inputs.version }}
            VCS_REF=${{ inputs.source_sha }}
            BUILD_DATE=${{ steps.candidate.outputs.created }}
            SOURCE_URL=https://github.com/404404/HardwareStatus
            CATALOG_REVISION=${{ needs.catalog.outputs.revision }}
            CATALOG_SCHEMA_VERSION=${{ needs.catalog.outputs.schema_version }}
            CATALOG_SHA256=${{ needs.catalog.outputs.sha256 }}
      - uses: docker/build-push-action@v6
        id: client_image
        with:
          context: .
          file: Dockerfile.client
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hardwarestatus-client:${{ steps.candidate.outputs.candidate_tag }}
          labels: |
            org.opencontainers.image.title=HardwareStatus Client
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.created=${{ steps.candidate.outputs.created }}
            org.opencontainers.image.source=https://github.com/404404/HardwareStatus
            org.opencontainers.image.licenses=MIT
            io.hardwarestatus.component=client
            io.hardwarestatus.unifi.catalog.revision=${{ steps.candidate.outputs.catalog_revision }}
            io.hardwarestatus.unifi.catalog.schema_version=${{ needs.catalog.outputs.schema_version }}
            io.hardwarestatus.unifi.catalog.sha256=${{ steps.candidate.outputs.catalog_sha256 }}
          build-args: |
            VERSION=${{ inputs.version }}
            VCS_REF=${{ inputs.source_sha }}
            BUILD_DATE=${{ steps.candidate.outputs.created }}
            SOURCE_URL=https://github.com/404404/HardwareStatus
            CATALOG_REVISION=${{ steps.candidate.outputs.catalog_revision }}
            CATALOG_SCHEMA_VERSION=${{ needs.catalog.outputs.schema_version }}
            CATALOG_SHA256=${{ steps.candidate.outputs.catalog_sha256 }}
      - name: Verify published immutable manifests
        env:
          TAG: ${{ steps.candidate.outputs.candidate_tag }}
          OWNER: ${{ steps.candidate.outputs.owner }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CREATED: ${{ steps.candidate.outputs.created }}
          CATALOG_REVISION: ${{ steps.candidate.outputs.catalog_revision }}
          CATALOG_SHA256: ${{ steps.candidate.outputs.catalog_sha256 }}
          SERVER_DIGEST: ${{ steps.server_image.outputs.digest }}
          CLIENT_DIGEST: ${{ steps.client_image.outputs.digest }}
        run: |
          server="ghcr.io/${OWNER}/hardwarestatus-server:${TAG}"
          client="ghcr.io/${OWNER}/hardwarestatus-client:${TAG}"
          docker buildx imagetools inspect "$server" | grep -F 'linux/amd64'
          docker buildx imagetools inspect "$client" | grep -F 'linux/amd64'
          docker pull "$server"
          docker pull "$client"
          python3 scripts/validate_image_provenance.py \
            --server-image "$server" \
            --client-image "$client" \
            --candidate-tag "$TAG" \
            --version "$VERSION" \
            --revision "$SOURCE_SHA" \
            --created "$CREATED" \
            --source https://github.com/404404/HardwareStatus \
            --catalog-revision "$CATALOG_REVISION" \
            --catalog-schema-version "${{ needs.catalog.outputs.schema_version }}" \
            --catalog-sha256 "$CATALOG_SHA256" \
            --require-server-catalog-provenance
          echo "SERVER_DIGEST=${SERVER_DIGEST}"
          echo "CLIENT_DIGEST=${CLIENT_DIGEST}"
